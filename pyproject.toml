[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interview-benchmark"
version = "0.2.0.dev1"
description = "A benchmark for evaluating answer-evaluation systems in AI interviews"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AIB contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
aib = "aib.cli:main"

[tool.setuptools.packages.find]
include = ["aib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
